name: Deploy Hub

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      wrangler-env:
        required: false
        default: ''
        type: string
      pre-release:
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      node-version: '24'

  test:
    uses: ./.github/workflows/test.yml
    with:
      node-version: '24'

  deploy:
    runs-on: ubuntu-latest
    needs: [quality, test]
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The tag (hub-1.2.3, or hub-1.2.3-beta.1 for a pre-release) is the source of truth for the release
      # make sure nobody tagged a commit whose package.json was never bumped to match.
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#hub-}"
          PKG_VERSION="$(node -p "require('./packages/hub/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match packages/hub/package.json version $PKG_VERSION" >&2
            exit 1
          fi

      # --outdir writes the bundled Worker to disk as a side effect of the same
      # deploy (it's independent of --dry-run), so the release below can attach
      # the exact bundle that got deployed.
      - name: Deploy to Cloudflare
        working-directory: packages/hub
        run: pnpm exec wrangler deploy --env "${{ inputs.wrangler-env }}" --outdir dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Zip deployed bundle
        working-directory: packages/hub/dist
        run: zip -r "../hub-${GITHUB_REF_NAME#hub-}.zip" .

      - name: GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          generateReleaseNotes: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: ${{ inputs.pre-release }}
          artifacts: packages/hub/hub-*.zip
