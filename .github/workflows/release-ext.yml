name: Release Extension

permissions:
  contents: read

on:
  push:
    tags:
      - 'ext-[0-9]+.[0-9]+.[0-9]+'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      node-version: '24'

  test:
    uses: ./.github/workflows/test.yml
    with:
      node-version: '24'

  release:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The tag (ext-1.2.3) is the source of truth for the release; make sure
      # nobody tagged a commit whose package.json was never bumped to match.
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ext-}"
          PKG_VERSION="$(node -p "require('./packages/ext/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match packages/ext/package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build extension
        run: pnpm --filter ext build

      - name: Zip Chrome build
        working-directory: packages/ext/.output
        run: zip -r "chrome-${GITHUB_REF_NAME#ext-}.zip" chrome-mv3

      - name: GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          generateReleaseNotes: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: |
            packages/ext/.output/chrome-*.zip
            packages/ext/.output/*-firefox.zip
            packages/ext/.output/*-sources.zip
