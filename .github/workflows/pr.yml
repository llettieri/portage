name: Pull Request

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      node-version: '24'

  test:
    uses: ./.github/workflows/test.yml
    with:
      node-version: '24'

  build:
    uses: ./.github/workflows/build.yml
    with:
      node-version: '24'
