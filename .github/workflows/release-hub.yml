name: Release Hub

permissions:
  contents: read

on:
  push:
    tags:
      - 'hub-[0-9]+.[0-9]+.[0-9]+'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      node-version: '24'

  test:
    uses: ./.github/workflows/test.yml
    with:
      node-version: '24'

  release:
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The tag (hub-1.2.3) is the source of truth for the release; make sure
      # nobody tagged a commit whose package.json was never bumped to match.
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#hub-}"
          PKG_VERSION="$(node -p "require('./packages/hub/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match packages/hub/package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Deploy to Cloudflare
        working-directory: packages/hub
        # `pnpm deploy` (no "run") is pnpm's own built-in command, not this
        # package's "deploy" script — must be invoked explicitly as a run.
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          generateReleaseNotes: true
