name = "portage-hub"
main = "src/index.ts"
compatibility_date = "2026-09-04"

[dev]
ip = "0.0.0.0"

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Bindings and migrations are not inherited by named environments — Cloudflare
# requires them to be redeclared per environment. `observability`, `name`,
# `main`, and `compatibility_date` above are inherited as-is.
[env.staging]
name = "portage-hub-staging"

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
