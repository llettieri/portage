<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portage</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 260px; padding: 8px; }
      .status { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #c0392b; }
      .dot.connected { background: #27ae60; }
      input, textarea { width: 100%; box-sizing: border-box; margin-bottom: 6px; font: inherit; }
      button { width: 100%; margin-bottom: 6px; }
      .received { margin-bottom: 8px; padding: 6px; border: 1px solid #ccc; }
      .received-title { font-weight: bold; }
      .received-url { word-break: break-all; color: #666; margin-bottom: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
